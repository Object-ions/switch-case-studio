<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicons & Android/Apple Device Icons -->
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Switch Case Studio" />
    <!--
      Route-variable head tags (title, description, canonical, og:title/
      og:description/og:url/og:type, twitter:title/description) are managed
      per-route by src/components/util/Seo.js — react-helmet-async can only
      REPLACE the <title>; any other static tag here would duplicate and
      conflict with the per-route one (two canonicals = Google picks at
      random). Only site-wide constants live below. The OG/Twitter fallback
      block stays because social scrapers don't run JS — a shared link always
      resolves to these tags.
    -->

    <!-- Open Graph / Twitter — site-wide fallback for non-JS scrapers -->
    <meta property="og:site_name" content="Switch Case Studio" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="Switch Case Studio — Landing Pages That Convert"
    />
    <meta
      property="og:description"
      content="Conversion-focused landing pages and websites, designed and built from scratch. Built for paid traffic, delivered in days."
    />
    <meta
      property="og:image"
      content="https://switchcasestudio.com/images/og/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Switch Case Studio — landing pages and websites that convert."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://switchcasestudio.com/images/og/og.png"
    />

    <!-- Structured data — Organization + WebSite (site-wide) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://switchcasestudio.com/#org",
            "name": "Switch Case Studio",
            "url": "https://switchcasestudio.com",
            "logo": "https://switchcasestudio.com/images/og/og.png",
            "description": "Studio building conversion-focused landing pages, websites, e-commerce stores, and web apps from scratch.",
            "email": "hello@switchcasestudio.com"
          },
          {
            "@type": "WebSite",
            "name": "Switch Case Studio",
            "alternateName": "SCS",
            "url": "https://switchcasestudio.com",
            "publisher": { "@id": "https://switchcasestudio.com/#org" }
          }
        ]
      }
    </script>

    <!-- Google Fonts — preconnect first, then stylesheet (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />

    <!-- Web Manifest Link (Pointing to your custom favicon folder) -->
    <link rel="manifest" href="/images/favicon/site.webmanifest" />
    <title>Switch Case Studio — Landing Pages That Convert</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
