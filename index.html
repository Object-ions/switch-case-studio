<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicons & Android/Apple Device Icons -->
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Switch Case Studio builds custom websites, e-commerce stores, and web apps from scratch. Design-led, performance-focused, fast turnaround."
    />
    <meta
      name="keywords"
      content="web design, e-commerce development, web app development, custom website design, conversion-focused design, Switch Case Studio"
    />
    <meta name="author" content="Switch Case Studio" />
    <link rel="canonical" href="https://switchcasestudio.com/" />

    <!-- Open Graph Tags -->
    <meta
      property="og:title"
      content="Switch Case Studio — Design-Led Digital Studio"
    />
    <meta
      property="og:description"
      content="Switch Case Studio builds custom websites, e-commerce stores, and web apps from scratch. Design-led, performance-focused, fast turnaround."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.switchcasestudio.com/" />
    <meta property="og:site_name" content="Switch Case Studio" />
    <meta property="og:locale" content="en_US" />

    <!-- OG Image Tags (Using your custom subfolder and absolute URL) -->
    <meta
      property="og:image"
      content="https://www.switchcasestudio.com/images/og/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Switch Case Studio — bespoke web design and development. Built with intent."
    />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Switch Case Studio — Design-Led Digital Studio"
    />
    <meta
      name="twitter:description"
      content="Switch Case Studio builds custom websites, e-commerce stores, and web apps from scratch. Design-led, performance-focused, fast turnaround."
    />
    <meta
      name="twitter:image"
      content="https://www.switchcasestudio.com/images/og/og.png"
    />
    <meta
      name="twitter:image:alt"
      content="Switch Case Studio — bespoke web design and development. Built with intent."
    />

    <!-- Structured data — Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Switch Case Studio",
        "url": "https://switchcasestudio.com",
        "logo": "https://switchcasestudio.com/images/og/og.png",
        "description": "Design-led digital studio building custom websites, e-commerce stores, and web apps from scratch.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Portland",
          "addressRegion": "OR",
          "addressCountry": "US"
        },
        "email": "hello@switchcasestudio.com",
        "sameAs": []
      }
    </script>

    <!-- Google Fonts — preconnect first, then stylesheet (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />

    <!-- Web Manifest Link (Pointing to your custom favicon folder) -->
    <link rel="manifest" href="/images/favicon/site.webmanifest" />
    <title>Switch Case Studio — Design-Led Digital Studio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
