<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicons & Android/Apple Device Icons -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/images/favicon/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/images/favicon/apple-touch-icon.png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Switch Case Studio: Flexible web design, development, hosting, graphic design, SEO, and more."
    />
    <meta
      name="keywords"
      content="web design, web development, web hosting, graphic design, SEO, email marketing, ad management, Switch Case Studio"
    />
    <meta name="author" content="Switch Case Studio" />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Switch Case Studio" />
    <meta
      property="og:description"
      content="Flexible web design, development, hosting, graphic design, SEO, and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.switchcasestudio.com/" />

    <!-- OG Image Tags (Using your custom subfolder and absolute URL) -->
    <meta
      property="og:image"
      content="https://www.switchcasestudio.com/images/og/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Switch Case Studio - Flexible web design, development, and SEO services."
    />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Switch Case Studio" />
    <meta
      name="twitter:description"
      content="Flexible web design, development, hosting, graphic design, SEO, and more."
    />
    <meta
      name="twitter:image"
      content="https://www.switchcasestudio.com/images/og/og.png"
    />

    <!-- Web Manifest Link (Pointing to your custom favicon folder) -->
    <link rel="manifest" href="%PUBLIC_URL%/images/favicon/site.webmanifest" />
    <title>Switch Case Studio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
