<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicons & Android/Apple Device Icons -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/images/favicon/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/images/favicon/apple-touch-icon.png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A boutique web design and development studio building custom, scope-based websites and digital brand experiences — built with intent."
    />
    <meta
      name="keywords"
      content="web design, web development, web hosting, graphic design, SEO, email marketing, ad management, Switch Case Studio"
    />
    <meta name="author" content="Switch Case Studio" />

    <!-- Open Graph Tags -->
    <meta
      property="og:title"
      content="Switch Case Studio — Custom Web Design & Development"
    />
    <meta
      property="og:description"
      content="A boutique web design and development studio building custom, scope-based websites and digital brand experiences — built with intent."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.switchcasestudio.com/" />
    <meta property="og:site_name" content="Switch Case Studio" />
    <meta property="og:locale" content="en_US" />

    <!-- OG Image Tags (Using your custom subfolder and absolute URL) -->
    <meta
      property="og:image"
      content="https://www.switchcasestudio.com/images/og/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Switch Case Studio — bespoke web design and development. Built with intent."
    />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Switch Case Studio — Custom Web Design & Development"
    />
    <meta
      name="twitter:description"
      content="A boutique web design and development studio building custom, scope-based websites and digital brand experiences — built with intent."
    />
    <meta
      name="twitter:image"
      content="https://www.switchcasestudio.com/images/og/og.png"
    />
    <meta
      name="twitter:image:alt"
      content="Switch Case Studio — bespoke web design and development. Built with intent."
    />

    <!-- Google Fonts — preconnect first, then stylesheet (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Web Manifest Link (Pointing to your custom favicon folder) -->
    <link rel="manifest" href="%PUBLIC_URL%/images/favicon/site.webmanifest" />
    <title>Switch Case Studio — Custom Web Design & Development</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
