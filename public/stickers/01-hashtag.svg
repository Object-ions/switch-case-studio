<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 348 118" width="348" height="118" role="img" aria-label="Switch Case Studio sticker: hashtag"><style>@font-face{font-family:D;src:url(data:font/woff2;base64,) format('woff2')}



.d{font-family:D,system-ui,sans-serif}.i{font-family:I,system-ui,sans-serif;font-weight:500}.b{font-family:I,system-ui,sans-serif;font-weight:800}
.m,.lift{transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite}
.wobble{animation:wobble 3.2s ease-in-out infinite}
.spin{animation:spin 24s linear infinite}
.spin-slow{animation:spin 60s linear infinite}
.spin-rev{animation:spin 45s linear infinite reverse}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.m{animation:none!important}}</style><g class="s" data-x="115" data-y="200" data-w="300" data-h="70"><g class="lift"><g class="m float" style="animation-delay:0.0s"><g transform="translate(0 0)"><defs><linearGradient id="g1"><stop offset="0" stop-color="#f06637"/><stop offset="1" stop-color="#1748ef"/></linearGradient></defs>
<g transform="rotate(-3 150 35)"><rect x="0" y="10" width="290" height="52" fill="url(#g1)"/><text x="145" y="48" text-anchor="middle" class="d" font-size="32" fill="#000">#switchcase</text></g></g></g></g></g></svg>