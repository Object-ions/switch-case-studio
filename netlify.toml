# Netlify deploy config — made explicit during the Vite migration.
# Previously the SPA fallback relied on Netlify's Create React App detection;
# Vite isn't guaranteed to get that automatically, so it's declared here.

[build]
  command = "npm run build"
  publish = "build"          # matches vite.config.js `build.outDir`

[build.environment]
  NODE_VERSION = "20"        # Vite 5 + Sass require Node 18+; pin to 20

# Single-page-app fallback: serve index.html for any path the static files
# don't cover, so client-side routes (deep links, refresh) don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
